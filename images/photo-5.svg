<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe0e8"/>
      <stop offset="0.25" stop-color="#e8d99a"/>
      <stop offset="1" stop-color="#caa25a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <!-- 黄色い壁の路地（遠近） -->
  <polygon points="0,120 250,240 250,800 0,800" fill="#e2b83c"/>
  <polygon points="800,120 550,240 550,800 800,800" fill="#d9ad34"/>
  <polygon points="250,240 550,240 550,800 250,800" fill="#c69a54" opacity="0.35"/>
  <!-- 扉と窓 -->
  <rect x="60" y="380" width="90" height="180" fill="#2e8b8b" rx="6"/>
  <rect x="640" y="360" width="90" height="200" fill="#2f7f92" rx="6"/>
  <rect x="80" y="240" width="70" height="70" fill="#7a5a2e" rx="6" opacity="0.7"/>
  <!-- ランタン -->
  <g>
    <line x1="150" y1="60" x2="650" y2="60" stroke="#8a6a3a" stroke-width="5" opacity="0.6"/>
    <ellipse cx="230" cy="100" rx="34" ry="42" fill="#e05252"/>
    <ellipse cx="360" cy="86" rx="30" ry="38" fill="#4aa3c0"/>
    <ellipse cx="480" cy="104" rx="34" ry="40" fill="#e8a03c"/>
    <ellipse cx="590" cy="90" rx="28" ry="36" fill="#67b06a"/>
  </g>
  <!-- 緑 -->
  <circle cx="250" cy="180" r="56" fill="#6f9a4e" opacity="0.85"/>
  <circle cx="320" cy="150" r="40" fill="#7fa85c" opacity="0.85"/>
  <circle cx="700" cy="620" r="44" fill="#6f9a4e" opacity="0.9"/>
  <circle cx="120" cy="640" r="40" fill="#7fa85c" opacity="0.9"/>
  <!-- 白いワンピースの人物 -->
  <g>
    <circle cx="400" cy="380" r="52" fill="#4a3524"/>
    <path d="M330 800 Q330 470 400 445 Q470 470 470 800 Z" fill="#f6efe2"/>
    <path d="M352 520 q48 26 96 0" stroke="#e0b8a8" stroke-width="8" fill="none" opacity="0.7"/>
  </g>
  <text x="400" y="775" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#5c421e">[写真5] ベトナムの路地と女性</text>
</svg>
